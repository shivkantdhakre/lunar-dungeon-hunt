  <path d="M58 32 L62 32 L61 80 L59 80 Z" fill="url(#crestBlue)" />
  <path d="M50 44 L70 44 L60 48 Z" fill="url(#crestGold)" />
  <polygon points="60,26 62,32 58,32" fill="#FFF" />
  <circle cx="60" cy="85" r="3" fill="url(#crestGold)" />
</svg>